[package]
name = "fastauc"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Fast, multithreaded classification, calibration and ranking metrics for Python"
license = "MIT"
readme = "README.md"
repository = "https://github.com/hen-ml/fastauc"
authors = ["Ming-Hen Tsai"]
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.30"
numpy = "0.30"
rayon = "1.10"
rustc-hash = "2"

[features]
# abi3-py39: one wheel per platform covers every CPython >= 3.9. Free-threaded
# CPython (3.14t) has no stable ABI yet; its wheels are built with
# `--no-default-features`, one per interpreter.
default = ["abi3"]
abi3 = ["pyo3/abi3-py39"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
