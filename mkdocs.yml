site_name: fastauc
site_description: Exact, fast classification, calibration and ranking metrics for Python, written in Rust.
site_url: https://hen-ml.github.io/fastauc/
repo_url: https://github.com/hen-ml/fastauc
repo_name: hen-ml/fastauc
edit_uri: edit/main/docs/
copyright: MIT License

nav:
  - Overview: index.md
  - Exact tie handling: ties.md
  - Binary and multiclass metrics: binary.md
  - Ranking metrics: ranking.md
  - scikit-learn drop-in: sklearn.md
  - Streaming and distributed: streaming.md
  - Confidence intervals and tests: significance.md
  - Performance: performance.md
  - API reference: api.md
  - Changelog: changelog.md

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: false
            members_order: source
            filters: ["!^_"]
            show_signature_annotations: true
            separate_signature: true
            heading_level: 2

validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
