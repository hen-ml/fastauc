# The `fastauc` name on PyPI: an alias that installs `pyfastauc`, so that
# `pip install fastauc` does what people expect. It ships no code.
# Keep `version` and the pin equal to the main package's version (CI checks).
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fastauc"
version = "0.2.0"
description = "Alias for pyfastauc: exact, fast classification, calibration and ranking metrics, written in Rust"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ming-Hen Tsai" }]
requires-python = ">=3.9"
dependencies = ["pyfastauc==0.2.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/hen-ml/fastauc"
Documentation = "https://hen-ml.github.io/fastauc/"

[tool.setuptools]
packages = []
py-modules = []
